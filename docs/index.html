<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213B" />
    <title>Itinerary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

html, body { overflow-x: hidden; background: #F7F3EC; }
body { background-image: radial-gradient(#E0D6C4 1px, transparent 1px); background-size: 24px 24px; }

.pd {
  --tx: #24211C; --muted: #6B6459; --line: #E6DFD2; --accent: #8A5A2B;
  font-family: Inter, system-ui, sans-serif;
  font-size: 15.5px; line-height: 1.55; color: var(--tx);
  background: transparent; max-width: none; margin: 0;
  padding: 22px 26px 30px;
}

.pd-head { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 18px; }
.pd-eyebrow { font-family: Inter, sans-serif; font-size: 11.5px; font-weight: 600;
  letter-spacing: .12em; color: #A08B63; }
.pd-title { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 36px;
  letter-spacing: -.01em; color: var(--tx); margin: 6px 0 4px; }
.pd-sub { font-family: Inter, sans-serif; font-size: 13.5px; color: var(--muted); }
.pd-lock { font-family: Inter, sans-serif; font-size: 12.5px; font-weight: 600; color: var(--muted);
  border: 1px solid var(--line); border-radius: 20px; padding: 8px 16px; text-transform: none;
  letter-spacing: 0; background: #FFFDF9; }

.pd-body { grid-template-columns: 340px minmax(0, 1fr); gap: 20px; }

.pd-cal { background: #FFFDF9; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.pd-calhead { font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; margin-bottom: 10px; }
.pd-nav { color: #A99A80; }
.pd-grid { border: none; gap: 3px; }
.pd-dow { font-family: Inter, sans-serif; font-size: 11.5px; font-weight: 600; color: #A08B63;
  border: none; padding: 4px 0; }
.pd-cell { border: none; border-radius: 9px; aspect-ratio: auto; min-height: 46px;
  justify-content: flex-start; padding-top: 7px; gap: 5px; }
.pd-cell.in { background: #F4EEE2; }
.pd-cell.in:hover { background: #EDE4D2; }
.pd-cell.out { color: #C8BDA8; background: transparent; }
.pd-cell.sel { background: var(--accent); color: #fff; box-shadow: none; }
.pd-cell.sel .pd-num { color: #fff; font-weight: 700; }
.pd-cell.today .pd-num { text-decoration-color: var(--accent); }
.pd-num { font-family: Inter, sans-serif; font-size: 14.5px; font-weight: 500; }
.pd-empty { background: transparent; }
.pd-legend { font-family: Inter, sans-serif; font-size: 11.5px; font-weight: 500;
  letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 14px; }

.pd-day { background: #FFFDF9; border: 1px solid var(--line); border-radius: 14px;
  min-height: calc(100vh - 220px); }
.pd-dayhead { border-bottom: 1px solid var(--line); padding: 18px 20px 16px; }
.pd-dayttl { font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700; }
.pd-dayyr { font-family: Inter, sans-serif; font-size: 13px; color: var(--muted); }
.pd-add { font-family: Inter, sans-serif; background: var(--accent); border-radius: 20px;
  padding: 10px 18px; font-size: 13.5px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.pd-add:hover { background: #75491F; }
.pd-list { padding: 4px 20px 20px; }
.pd-blank { font-family: Inter, sans-serif; font-size: 14.5px; color: var(--muted); }

.pd-entry { border-bottom: 1px dashed var(--line); padding: 16px 0; gap: 14px; }
.pd-time { font-family: Inter, sans-serif; font-size: 15.5px; font-weight: 700;
  color: var(--accent); padding-top: 2px; }
.pd-kind { display: inline-block; font-family: Inter, sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: .05em; padding: 3px 9px; border-radius: 20px; opacity: 1;
  background: color-mix(in srgb, var(--ink) 14%, #fff); }
.pd-etitle { font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 600;
  color: var(--tx); margin: 6px 0 3px; }
.pd-place { font-family: Inter, sans-serif; font-size: 14px; color: var(--muted); opacity: 1; }
.pd-ref { font-family: Inter, sans-serif; font-size: 13px; color: var(--muted); }
.pd-stamp { font-family: Inter, sans-serif; transform: none; box-shadow: none; border: none;
  background: #F2E7D3; border-radius: 8px; padding: 7px 11px; }
.pd-stampwrap:nth-of-type(even) .pd-stamp { transform: none; }
.pd-stamp:hover { transform: none; background: #E9DABF; }
.pd-stampk { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: #8A6A3A; }
.pd-stampn { font-size: 13px; font-weight: 500; color: #5C4423; }
.pd-clip { font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: var(--muted);
  border: 1px dashed #DCCFB6; border-radius: 8px; padding: 7px 11px; }
.pd-edit { font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: var(--muted); }

.pd-editor { background: #FBF6EC; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.pd-editor label { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;
  letter-spacing: 0; text-transform: none; color: var(--muted); }
.pd-editor input, .pd-editor select { font-family: Inter, sans-serif; font-size: 15px;
  border: 1px solid #DFD5C2; border-radius: 8px; padding: 10px 12px; }
.pd-save { font-family: Inter, sans-serif; background: var(--accent); border-radius: 20px;
  padding: 10px 20px; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 13.5px; }
.pd-cancel { font-family: Inter, sans-serif; border-radius: 20px; border-color: #DFD5C2;
  padding: 10px 18px; font-size: 13.5px; }
.pd-del { font-family: Inter, sans-serif; color: #A33; font-size: 13.5px; }
.pd-notice { font-family: Inter, sans-serif; border-radius: 10px; font-size: 13.5px; }

.pd-mrz { display: none; }

.pd-gate { min-height: 88vh; }
.pd-cover { background: #FFFDF9; color: var(--tx); box-shadow: none;
  border: 1px solid var(--line); border-radius: 18px; padding: 40px 34px 34px; }
.pd-crest { color: var(--accent); }
.pd-covertop { font-family: Inter, sans-serif; font-size: 11.5px; font-weight: 600;
  letter-spacing: .12em; color: #A08B63; }
.pd-covertitle { font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 700; color: var(--tx); }
.pd-covercode { font-family: Inter, sans-serif; font-size: 13px; color: var(--muted);
  border-bottom: 1px solid var(--line); }
.pd-cover label { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;
  letter-spacing: 0; text-transform: none; color: var(--muted); }
.pd-cover input { background: #fff; border: 1px solid #DFD5C2; border-radius: 10px;
  color: var(--tx); font-family: Inter, sans-serif; }
.pd-cover input::placeholder { color: #B9AE99; }
.pd-pin { letter-spacing: .4em; font-size: 22px; }
.pd-open { background: var(--accent); color: #fff; border-radius: 22px; padding: 14px;
  font-family: Inter, sans-serif; letter-spacing: 0; text-transform: none; font-size: 14.5px; }
.pd-open:hover:not(:disabled) { background: #75491F; }
.pd-error { color: #A33; }

@media (max-width: 900px) {
  .pd { padding: 16px 14px 26px; }
  .pd-body { grid-template-columns: 1fr; gap: 14px; }
  .pd-title { font-size: 30px; }
  .pd-day { min-height: auto; }
  .pd-dayhead { padding: 16px; flex-wrap: wrap; gap: 12px; }
  .pd-list { padding: 4px 16px 18px; }
  .pd-entry { grid-template-columns: 54px minmax(0, 1fr); }
  .pd-side { grid-column: 2; align-items: flex-start; padding-top: 0; }
  .pd-editor input, .pd-editor select { font-size: 16px; }
  .pd-stampn { max-width: 160px; }
}
</style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
